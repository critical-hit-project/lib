name: critical-hit
services:
  postgres:
    image: postgres:16
    container_name: db_critical_hit
    environment:
      POSTGRES_DB: critical_hit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  jogo-service:
    build: ../../jogo/
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5435/critical_hit?currentSchema=jogo
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "8081:8081"

volumes:
  postgres_data:
